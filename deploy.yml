# data 폴더에 CSV를 올리면(또는 build 폴더를 고치면) 대시보드를 다시 만들어 GitHub Pages에 배포한다
name: 대시보드 자동 업데이트

on:
  push:
    branches: [main]
    paths: ["data/**", "build/**", "config.json", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 대시보드 만들기
        run: node build/build.js data --out _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
